<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sha Sha Shandaar — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sf:#E8A838;--sf-dim:#FFF8E8;--sf-border:#F5D98B;
  --coal:#1B1B2F;--coal2:#252542;--coal3:#31315a;
  --page:#F0F2F5;--wh:#fff;
  --sage:#27AE60;--sage-dim:#EAFAF1;
  --ember:#C23B22;--ember-dim:#FEE2E2;
  --sky:#2D9CDB;--sky-dim:#EBF5FB;
  --amber:#F59E0B;--amber-dim:#FEF3C7;
  --violet:#7C3AED;--violet-dim:#EDE9FE;
  --txt:#111827;--muted:#6B7280;--bdr:#E5E7EB;--sbdr:#F3F4F6;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.05);
  --shadow-md:0 4px 12px rgba(0,0,0,.1);
  --R:10px;--SBW:220px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--page);color:var(--txt);display:flex;height:100vh;overflow:hidden;}

/* ── SIDEBAR ── */
.sb{width:var(--SBW);background:var(--coal);display:flex;flex-direction:column;flex-shrink:0;height:100vh;overflow-y:auto;}
.sb::-webkit-scrollbar{display:none;}
.sb-logo{padding:22px 20px 16px;border-bottom:1px solid var(--coal3);}
.sb-brand{font-family:'Poppins',sans-serif;font-weight:800;font-size:13px;color:var(--sf);line-height:1.3;}
.sb-tag{font-size:10px;color:rgba(255,255,255,.4);font-weight:500;margin-top:2px;}
.sb-section{padding:20px 12px 8px;font-size:10px;font-weight:700;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.1em;}
.sb-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;margin:1px 8px;cursor:pointer;color:rgba(255,255,255,.6);font-size:13px;font-weight:500;transition:all .15s;}
.sb-item:hover{background:var(--coal2);color:rgba(255,255,255,.9);}
.sb-item.on{background:rgba(232,168,56,.15);color:var(--sf);}
.sb-item svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex-shrink:0;}
.sb-badge{margin-left:auto;background:var(--ember);color:#fff;font-size:10px;font-weight:700;padding:1px 7px;border-radius:10px;line-height:1.6;}
.sb-bottom{margin-top:auto;padding:16px 8px;border-top:1px solid var(--coal3);}
.sb-user{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;}
.sb-avatar{width:34px;height:34px;border-radius:10px;background:var(--sf);display:flex;align-items:center;justify-content:center;font-family:'Poppins',sans-serif;font-weight:800;font-size:13px;color:var(--coal);flex-shrink:0;}
.sb-uname{font-size:12.5px;font-weight:600;color:rgba(255,255,255,.85);}
.sb-urole{font-size:10.5px;color:rgba(255,255,255,.35);margin-top:1px;}

/* ── MAIN AREA ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}

/* ── TOPBAR ── */
.topbar{height:56px;background:var(--wh);border-bottom:1px solid var(--bdr);display:flex;align-items:center;padding:0 24px;gap:16px;flex-shrink:0;}
.topbar-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:17px;flex:1;}
.topbar-search{display:flex;align-items:center;gap:8px;background:var(--sbdr);border-radius:8px;padding:7px 12px;font-size:13px;color:var(--muted);cursor:text;border:1.5px solid transparent;}
.topbar-search:focus-within{border-color:var(--sf);background:var(--wh);}
.topbar-search input{border:none;background:none;outline:none;font-family:'Inter',sans-serif;font-size:13px;width:180px;color:var(--txt);}
.topbar-search svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;flex-shrink:0;}
.tb-btn{padding:7px 10px;border-radius:8px;border:1.5px solid var(--bdr);background:var(--wh);cursor:pointer;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--txt);transition:border-color .15s;}
.tb-btn:hover{border-color:var(--sf);}
.tb-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}
.tb-notif{position:relative;}
.tb-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--ember);border-radius:50%;border:1.5px solid var(--wh);}

/* ── CONTENT ── */
.content{flex:1;overflow-y:auto;padding:24px;}
.content::-webkit-scrollbar{width:5px;}
.content::-webkit-scrollbar-track{background:transparent;}
.content::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px;}
.pg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.pg-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;}
.pg-sub{font-size:13px;color:var(--muted);margin-top:2px;}

/* ── CARDS ── */
.card{background:var(--wh);border-radius:var(--R);border:1px solid var(--bdr);box-shadow:var(--shadow);}
.cb{padding:18px 20px;}
.card-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;margin-bottom:14px;}

/* ── STAT CARDS ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
.stat-card{background:var(--wh);border-radius:var(--R);border:1px solid var(--bdr);padding:18px 20px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
.stat-card:hover{border-color:var(--sf-border);box-shadow:var(--shadow-md);}
.stat-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.stat-value{font-family:'Poppins',sans-serif;font-weight:700;font-size:26px;line-height:1;}
.stat-delta{font-size:11.5px;margin-top:5px;font-weight:600;}
.delta-up{color:var(--sage);}
.delta-dn{color:var(--ember);}
.delta-nt{color:var(--muted);}
.stat-ico{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}

/* ── BADGES ── */
.bge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.bg-pending{background:#FEF3C7;color:#B45309;}
.bg-fulfilled{background:var(--sky-dim);color:#0369A1;}
.bg-delivered{background:var(--sage-dim);color:var(--sage);}
.bg-amended{background:var(--violet-dim);color:var(--violet);}
.bg-paid{background:var(--sage-dim);color:var(--sage);}
.bg-unpaid{background:var(--ember-dim);color:var(--ember);}
.bg-overdue{background:var(--ember-dim);color:var(--ember);}
.bg-active{background:var(--sage-dim);color:var(--sage);}
.bg-paused{background:var(--amber-dim);color:#92400E;}
.bg-inactive{background:var(--ember-dim);color:var(--ember);}
.bg-removed{background:#F3F4F6;color:var(--muted);}

/* ── DATA TABLE ── */
.tbl-wrap{overflow-x:auto;}
.tbl{width:100%;border-collapse:collapse;}
.tbl th{padding:10px 16px;text-align:left;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sbdr);border-bottom:2px solid var(--bdr);white-space:nowrap;}
.tbl td{padding:13px 16px;border-bottom:1px solid var(--bdr);font-size:13.5px;vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.tbl tbody tr{cursor:pointer;transition:background .1s;}
.tbl tbody tr:hover td{background:#FAFAFA;}
.tbl tbody tr.no-hover{cursor:default;}
.tbl tbody tr.no-hover:hover td{background:none;}
.tbl-id{font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;}
.tbl-muted{font-size:12px;color:var(--muted);margin-top:1px;}

/* ── BUTTONS ── */
.btn{font-family:'Inter',sans-serif;font-weight:600;border:none;cursor:pointer;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:opacity .15s,background .15s;}
.btn:active{opacity:.75;}
.btn-p{background:var(--sf);color:var(--coal);padding:9px 16px;font-size:13px;}
.btn-p:hover{background:#dca030;}
.btn-s{background:var(--wh);color:var(--txt);border:1.5px solid var(--bdr);padding:8px 14px;font-size:13px;}
.btn-s:hover{border-color:var(--sf);}
.btn-danger{background:var(--ember-dim);color:var(--ember);padding:8px 14px;font-size:13px;}
.btn-success{background:var(--sage-dim);color:var(--sage);padding:8px 14px;font-size:13px;}
.btn-sky{background:var(--sky-dim);color:var(--sky);padding:8px 14px;font-size:13px;border:1px solid #bee3f8;}
.btn-sm{padding:5px 11px;font-size:12px;border-radius:6px;}
.btn-icon{width:30px;height:30px;padding:0;border-radius:7px;background:var(--sbdr);color:var(--muted);border:1px solid var(--bdr);}
.btn-icon:hover{background:var(--bdr);}
.btn-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}

/* ── FILTERS ── */
.filter-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.filter-select{padding:8px 12px;border:1.5px solid var(--bdr);border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;background:var(--wh);color:var(--txt);cursor:pointer;}
.filter-select:focus{outline:none;border-color:var(--sf);}
.chip-grp{display:flex;gap:6px;}
.chip{padding:6px 14px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr);background:var(--wh);color:var(--muted);transition:all .15s;}
.chip.on{background:var(--sf);color:var(--coal);border-color:var(--sf);}
.chip:hover:not(.on){border-color:var(--sf-border);}
.search-input{padding:8px 12px;border:1.5px solid var(--bdr);border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;background:var(--wh);color:var(--txt);width:200px;}
.search-input:focus{outline:none;border-color:var(--sf);}
.ml-auto{margin-left:auto;}

/* ── FORM ── */
.form-group{margin-bottom:14px;}
.form-label{display:block;font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
.form-input{width:100%;padding:10px 13px;border:1.5px solid var(--bdr);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;color:var(--txt);background:var(--wh);}
.form-input:focus{outline:none;border-color:var(--sf);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-textarea{width:100%;padding:10px 13px;border:1.5px solid var(--bdr);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;color:var(--txt);resize:vertical;min-height:80px;}
.form-textarea:focus{outline:none;border-color:var(--sf);}
.form-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--bdr);}

/* ── MODAL ── */
.modal-ov{position:fixed;inset:0;background:rgba(27,27,47,.5);display:none;align-items:center;justify-content:center;z-index:1000;}
.modal-ov.on{display:flex;}
.modal-box{background:var(--wh);border-radius:16px;padding:28px;width:560px;max-height:85vh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.2);}
.modal-box.wide{width:720px;}
.modal-box::-webkit-scrollbar{width:4px;}
.modal-box::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px;}
.modal-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;}
.modal-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:18px;}
.modal-sub{font-size:13px;color:var(--muted);margin-top:3px;}
.modal-close{width:32px;height:32px;border-radius:8px;background:var(--sbdr);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;}
.modal-close:hover{background:var(--bdr);}
.modal-close svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}

/* ── ALERT BOX ── */
.alert{padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:10px;display:flex;align-items:flex-start;gap:10px;}
.alert-warn{background:var(--amber-dim);border:1px solid #FDE68A;color:#92400E;}
.alert-error{background:var(--ember-dim);border:1px solid #FECACA;color:var(--ember);}
.alert-info{background:var(--sky-dim);border:1px solid #BAE6FD;color:#0369A1;}
.alert-success{background:var(--sage-dim);border:1px solid #A7F3D0;color:var(--sage);}

/* ── DASHBOARD GRID ── */
.dash-grid{display:grid;grid-template-columns:1fr 340px;gap:16px;}
.dash-left{display:flex;flex-direction:column;gap:16px;}
.dash-right{display:flex;flex-direction:column;gap:16px;}

/* ── FRANCHISE BAR ── */
.f-bar-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--bdr);}
.f-bar-row:last-child{border-bottom:none;}
.f-bar-name{font-size:13px;font-weight:600;width:110px;flex-shrink:0;}
.f-bar-track{flex:1;height:7px;background:var(--sbdr);border-radius:4px;}
.f-bar-fill{height:100%;border-radius:4px;background:var(--sf);}
.f-bar-amt{font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;width:72px;text-align:right;flex-shrink:0;}

/* ── INVOICE FLASH ── */
.inv-flash{background:linear-gradient(135deg,var(--sage-dim),#d1fae5);border:1px solid #6EE7B7;border-radius:10px;padding:13px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;}

/* ── RECIPE CARDS ── */
.recipe-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.recipe-card{background:var(--wh);border:1px solid var(--bdr);border-radius:var(--R);padding:16px;position:relative;}
.recipe-del{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:6px;background:var(--sbdr);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.recipe-del:hover{background:var(--ember-dim);color:var(--ember);}
.recipe-del svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;}
.recipe-trigger{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;}
.recipe-name{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;margin-bottom:10px;}
.recipe-suggests{display:flex;flex-direction:column;gap:6px;}
.recipe-sug{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--sf-dim);border-radius:7px;font-size:13px;}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--coal);color:#fff;padding:13px 20px;border-radius:10px;font-size:13.5px;font-weight:500;display:none;z-index:2000;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap;gap:10px;align-items:center;}
.toast.on{display:flex;}

/* ── TABS ── */
.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--bdr);margin-bottom:20px;}
.tab{padding:10px 18px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:color .15s;}
.tab.on{color:var(--sf);border-bottom-color:var(--sf);}
.tab:hover:not(.on){color:var(--txt);}

/* ── PAYMENT ── */
.pay-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--bdr);}
.pay-row:last-child{border-bottom:none;}

/* ── INVENTORY INLINE EDIT ── */
.price-cell{display:flex;align-items:center;gap:6px;}
.price-edit-input{width:75px;padding:5px 8px;border:1.5px solid var(--sf);border-radius:6px;font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:var(--txt);}
.price-edit-input:focus{outline:none;}

/* ── EMPTY STATE ── */
.empty{text-align:center;padding:40px;color:var(--muted);}
.empty-icon{font-size:36px;margin-bottom:10px;}
.empty p{font-size:14px;}

/* ── RESPONSIVE MOBILE ── */
.hamburger{display:none;width:36px;height:36px;border-radius:8px;background:var(--sbdr);border:1.5px solid var(--bdr);cursor:pointer;align-items:center;justify-content:center;flex-shrink:0;}
.hamburger svg{width:18px;height:18px;stroke:var(--txt);fill:none;stroke-width:2;}
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199;}
.sb-overlay.on{display:block;}

@media(max-width:900px){
  body{overflow:auto;}
  .sb{position:fixed;left:-100%;top:0;bottom:0;z-index:200;transition:left .25s ease;width:260px;height:100vh;}
  .sb.open{left:0;}
  .main{width:100%;}
  .topbar{padding:0 14px;gap:10px;}
  .hamburger{display:flex;}
  .topbar-search input{width:120px;}
  .content{padding:14px;}
  .stats-grid{grid-template-columns:1fr 1fr;}
  .dash-grid{grid-template-columns:1fr;}
  .notif-compose{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr;}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .tbl{min-width:600px;}
  .modal-box,.modal-box.wide{width:calc(100vw - 32px);max-height:90vh;margin:16px;}
  .recipe-grid{grid-template-columns:1fr;}
  .pg-header{flex-direction:column;align-items:flex-start;gap:10px;}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr;}
  .topbar-search{display:none;}
}
.notif-log-item{padding:13px 0;border-bottom:1px solid var(--bdr);display:flex;gap:12px;}
.notif-log-item:last-child{border-bottom:none;}
</style>
</head>
<body>
<!-- SIDEBAR OVERLAY -->
<div class="sb-overlay" id="sb-overlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sb" id="sidebar">
  <div class="sb-logo">
    <div class="sb-brand">Sha Sha Shandaar<br>Shawarma</div>
    <div class="sb-tag">Admin Dashboard</div>
  </div>

  <div class="sb-section">Main</div>
  <div class="sb-item on" onclick="go('dashboard')" id="nav-dashboard">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    Dashboard
  </div>
  <div class="sb-item" onclick="go('orders')" id="nav-orders">
    <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/></svg>
    All Orders
    <span class="sb-badge" id="sb-orders-badge"></span>
  </div>

  <div class="sb-section">Catalogue</div>
  <div class="sb-item" onclick="go('inventory')" id="nav-inventory">
    <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 002 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
    Inventory
  </div>
  <div class="sb-item" onclick="go('recipes')" id="nav-recipes">
    <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
    Item Templates
  </div>

  <div class="sb-section">Business</div>
  <div class="sb-item" onclick="go('franchises')" id="nav-franchises">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    Franchises & Users
  </div>
  <div class="sb-item" onclick="go('payments')" id="nav-payments">
    <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
    Payments
    <span class="sb-badge" id="sb-pay-badge"></span>
  </div>
  <div class="sb-item" onclick="go('notifications')" id="nav-notifications">
    <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
    Notifications
  </div>
  <div class="sb-item" onclick="go('reports')" id="nav-reports">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Reports
  </div>

  <div class="sb-bottom">

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sb-overlay').classList.toggle('on');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sb-overlay').classList.remove('on');
}

const TITLES={dashboard:'Dashboard',orders:'All Orders',inventory:'Inventory Management',recipes:'Item Templates',franchises:'Franchises & Users',payments:'Payments',notifications:'Notifications',reports:'Reports'};

function go(sc){
  S.screen=sc;
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.remove('on'));
  const nav=document.getElementById('nav-'+sc);
  if(nav) nav.classList.add('on');
  closeSidebar();
  document.getElementById('topbar-title').textContent=TITLES[sc]||sc;
  updateBadges();
  render();
}

function updateBadges(){
  const pendOrds=S.orders.filter(o=>o.status==='pending'||o.status==='amended').length;
  const pendPay=S.pending.length;
  const ob=document.getElementById('sb-orders-badge');
  const pb=document.getElementById('sb-pay-badge');
  if(ob) ob.textContent=pendOrds||''; if(ob) ob.style.display=pendOrds?'':'none';
  if(pb) pb.textContent=pendPay||''; if(pb) pb.style.display=pendPay?'':'none';
}

function render(){
  const renders={dashboard:rDash,orders:rOrders,inventory:rInv,recipes:rRecipes,franchises:rFranchises,payments:rPayments,notifications:rNotifs,reports:rReports};
  document.getElementById('content').innerHTML=(renders[S.screen]||rDash)();
}

// ══════════════════════════════════════
// BADGE HELPER

function bg(st){
  const m={pending:['bg-pending','Pending'],fulfilled:['bg-fulfilled','Fulfilled'],delivered:['bg-delivered','Delivered'],amended:['bg-amended','Amended'],paid:['bg-paid','Paid'],unpaid:['bg-unpaid','Unpaid'],overdue:['bg-overdue','Overdue ⚠'],active:['bg-active','Active'],paused:['bg-paused','Paused'],inactive:['bg-inactive','Inactive'],removed:['bg-removed','Removed']};
  const[c,l]=m[st]||['bg-pending',st];
  return`<span class="bge ${c}">${l}</span>`;
}

      <div class="stat-value" style="color:${overdueAmt>0?'var(--ember)':'var(--sage)'};">₹${(overdueAmt/1000).toFixed(1)}K</div>

          </div>`).join('')}
      </div>`:''}

      <!-- Recent Orders Table -->
      <div class="card">

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">

  if(search) list=list.filter(o=>o.id.toLowerCase().includes(search.toLowerCase())||o.fr.toLowerCase().includes(search.toLowerCase()));

  return`
  <div class="pg-header">

  </div>
  <div class="filter-bar">
    <select class="filter-select" onchange="S.ordFil.franchise=this.value;render()">
      <option value="all">All Franchises</option>
      ${S.franchises.map(f=>`<option value="${f.id}" ${fFil===f.id?'selected':''}>${f.name}</option>`).join('')}
    </select>
    <div class="chip-grp">
      ${['all','pending','fulfilled','delivered','amended'].map(s=>`
        <span class="chip ${sFil===s?'on':''}" onclick="S.ordFil.status='${s}';render()">${s.charAt(0).toUpperCase()+s.slice(1)}</span>`).join('')}
    </div>
    <input class="search-input ml-auto" placeholder="Search order ID or franchise..." value="${search}" oninput="S.ordFil.search=this.value;render()">

                  ?`<div class="price-cell"><span style="color:var(--muted);font-size:12px;">₹</span><input class="price-edit-input" id="price-inp-${item.id}" value="${item.price}" type="number" min="1" autofocus>
                     <button class="btn btn-success btn-sm" onclick="savePrice('${item.id}')">Save</button>
                     <button class="btn btn-s btn-sm" onclick="S.editPriceId=null;render()">✕</button></div>`
                  :`<div class="price-cell" style="cursor:pointer;" onclick="S.editPriceId='${item.id}';render()" title="Click to edit price">
                      <span style="font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;">₹${item.price}</span>
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </div>`}
              </td>
              <td>
                <select class="filter-select" style="padding:5px 10px;font-size:12.5px;" onchange="changeUnit('${item.id}',this.value)">
                  <option ${item.unit==='kg'?'selected':''}>kg</option>
                  <option ${item.unit==='units'?'selected':''}>units</option>
                  <option ${item.unit==='litres'?'selected':''}>litres</option>
                </select>
              </td>
              <td>${bg(item.status)}</td>
              <td>
                <div style="display:flex;gap:6px;">
                  ${item.status==='active'
                    ?`<button class="btn btn-sm" style="background:var(--amber-dim);color:#92400E;border:none;cursor:pointer;font-weight:600;padding:5px 11px;font-size:12px;border-radius:6px;" onclick="toggleItem('${item.id}','paused')">⏸ Pause</button>`
                    :`<button class="btn btn-success btn-sm" onclick="toggleItem('${item.id}','active')">▶ Activate</button>`}
                  <button class="btn btn-s btn-sm" onclick="openModal('edit-item','${item.id}')">Edit</button>
                  <button class="btn btn-danger btn-sm" onclick="removeItem('${item.id}')">Remove</button>
                </div>
              </td>

function savePrice(id){
  const inp=document.getElementById('price-inp-'+id);
  if(!inp) return;
  const val=parseFloat(inp.value);
  if(isNaN(val)||val<=0){toast('Enter a valid price');return;}
  const item=S.inventory.find(i=>i.id===id);
  if(item){item.price=val;}
  S.editPriceId=null;
  render();toast(`✅ Price updated to ₹${val} for ${item.name}`);
}
function changeUnit(id,unit){
  const item=S.inventory.find(i=>i.id===id);
  if(item) item.unit=unit;
  toast(`Unit changed to "${unit}" for ${item.name}`);
}
function toggleItem(id,newStatus){
  const item=S.inventory.find(i=>i.id===id);
  if(item) item.status=newStatus;
  render();
  toast(newStatus==='paused'?`⏸ ${item.name} paused — hidden from franchise portal`:`▶ ${item.name} activated — visible to all franchises`);
}
function removeItem(id){
  const item=S.inventory.find(i=>i.id===id);
  if(!item) return;
  if(!confirm(`Remove "${item.name}" from inventory? This cannot be undone.`)) return;
  S.inventory=S.inventory.filter(i=>i.id!==id);
  render();toast(`🗑️ ${item.name} removed from inventory`);
}

function rProductRecipes(){
  return`
  <p style="font-size:13px;color:var(--muted);margin-bottom:16px;">Define what goes into each menu item. Used to calculate raw material cost, expected yield, and wastage.</p>
  <div class="recipe-grid">
    ${S.productRecipes.map(r=>{
      // Calculate raw material cost
      const rawCost=r.ingredients.filter(i=>i.invId).reduce((s,i)=>{
        const invItem=S.inventory.find(x=>x.id===i.invId);
        if(!invItem) return s;
        const costPerG=invItem.unit==='kg'?invItem.price/1000:invItem.price;
        return s+(costPerG*i.qty);
      },0);
      const pkgCost=r.ingredients.filter(i=>i.type==='packaging'&&i.cost).reduce((s,i)=>s+i.cost,0);
      const totalCost=rawCost+pkgCost;
      const margin=r.sellingPrice-totalCost;
      return`
        <div class="recipe-card">
          <button class="recipe-del" onclick="deleteProductRecipe('${r.id}')"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg></button>

            <div>
              <div style="font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;">${r.category}</div>
              <div class="recipe-name" style="margin-bottom:0;">${r.name}</div>
            </div>
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px;">
            <div style="background:var(--sbdr);border-radius:7px;padding:8px;text-align:center;">
              <div style="font-size:10px;color:var(--muted);font-weight:600;margin-bottom:2px;">Cost</div>
              <div style="font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;">₹${totalCost.toFixed(1)}</div>
            </div>
            <div style="background:var(--sbdr);border-radius:7px;padding:8px;text-align:center;">
              <div style="font-size:10px;color:var(--muted);font-weight:600;margin-bottom:2px;">Selling</div>
              <div style="font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;">₹${r.sellingPrice}</div>
            </div>
            <div style="background:${margin>0?'var(--sage-dim)':'var(--ember-dim)'};border-radius:7px;padding:8px;text-align:center;">
              <div style="font-size:10px;color:var(--muted);font-weight:600;margin-bottom:2px;">Margin</div>
              <div style="font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:${margin>0?'var(--sage)':'var(--ember)'};">₹${margin.toFixed(1)}</div>
            </div>
          </div>
          <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px;">Ingredients (${r.ingredients.length})</div>
          <div style="max-height:130px;overflow-y:auto;">
            ${r.ingredients.map(i=>`
              <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--sbdr);font-size:12.5px;">
                <span style="color:${i.type==='packaging'?'var(--sky)':'var(--txt)'};">${i.name}</span>
                <span style="color:var(--muted);font-weight:600;">${i.qty}${i.unit}</span>
              </div>`).join('')}
          </div>
          <button class="btn btn-s btn-sm" style="width:100%;margin-top:10px;" onclick="openModal('edit-product-recipe','${r.id}')">Edit Recipe</button>
        </div>`;}).join('')}

      <span style="font-size:28px;">+</span>
      <span style="font-size:13px;font-weight:600;">Add Product Recipe</span>
    </div>
  </div>`;
}

          <tbody>

                <td style="color:var(--muted);">${p.method}</td>

function sendReminder(id,ev){
  if(ev) ev.stopPropagation();
  const p=S.pending.find(x=>x.id===id);
  if(!p) return;
  p.reminderSent=true;
  p.reminderDate='26 Jul 2026';
  render();toast(`📧 Payment reminder sent to ${p.fr} for ₹${p.amt.toLocaleString()}`);
}
function markPaid(id){
  const p=S.pending.find(x=>x.id===id);
  if(!p) return;
  const ord=S.orders.find(o=>o.id===p.oid);
  if(ord) ord.pay='paid';
  S.phist.unshift({inv:p.inv,fr:p.fr,amt:p.amt,method:'Manual Entry',date:'26 Jul 2026'});
  S.pending=S.pending.filter(x=>x.id!==id);
  render();toast(`✅ Payment received — ₹${p.amt.toLocaleString()} from ${p.fr}`);
}

function sendNotification(){

let invCounter=990;
function fulfillOrder(id,ev){
  if(ev) ev.stopPropagation();
  const o=S.orders.find(x=>x.id===id);
  if(!o) return;
  o.status='fulfilled';
  invCounter++;
  const invId='INV-0'+invCounter;
  o.invoiceId=invId;
  const fr=S.franchises.find(f=>f.id===o.fid);
  S.pending.push({id:'P'+Date.now(),inv:invId,fid:o.fid,fr:o.fr,oid:o.id,amt:o.amt,due:'2 Aug 2026',status:'pending',reminderSent:false});
  updateBadges();render();
  toast(`⚡ #${id} fulfilled — Invoice ${invId} generated & sent to ${o.fr}`);
}

function markDelivered(id,ev){
  if(ev) ev.stopPropagation();
  const o=S.orders.find(x=>x.id===id);
  if(o) o.status='delivered';
  updateBadges();render();
  toast(`✅ #${id} marked as delivered`);
}

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Reduce a quantity to 0 to remove an item. The franchise owner will see exactly what was fulfilled. A revised invoice is auto-generated.
      </div>
      <table class="tbl" style="margin-bottom:16px;">
        <thead><tr><th>Item</th><th>Ordered</th><th>Fulfilling</th><th>Unit Price</th></tr></thead>
        <tbody>
          ${items.map((i,idx)=>`
            <tr class="no-hover">
              <td style="font-weight:600;">${i.n}</td>
              <td style="color:var(--muted);">${i.q} ${i.u}</td>
              <td><input type="number" id="ful-q-${idx}" value="${i.q}" min="0" step="${i.u==='units'?1:0.5}"
                style="width:80px;padding:6px 8px;border:1.5px solid var(--bdr);border-radius:6px;font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;"
                oninput="this.style.borderColor=parseFloat(this.value)<${i.q}?'var(--ember)':'var(--bdr)'"></td>
              <td style="color:var(--muted);">₹${i.p}/${i.u}</td>
            </tr>`).join('')}
        </tbody>
      </table>
      <div id="ful-total-preview" style="background:var(--sbdr);border-radius:8px;padding:12px 16px;font-size:13.5px;color:var(--muted);">
        Adjust quantities above to see revised total.
      </div>
      <div class="form-footer">
        <button class="btn btn-sky" onclick="confirmFulfill('${o.id}',${JSON.stringify(items)})">⚡ Confirm & Generate Invoice</button>
        <button class="btn btn-s" onclick="closeModal()">Cancel</button>
      </div>`;
  }

  if(type==='add-recipe'){
    const items=S.inventory.filter(i=>i.status==='active');
    const opts=items.map(i=>`<option>${i.name}</option>`).join('');
    return`
      <div class="modal-hd">
        <div><div class="modal-title">Add Ordering Template</div><div class="modal-sub">Suggest items when a franchise orders the trigger item</div></div>
        <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;">Trigger Item</div>
      <div style="display:grid;grid-template-columns:1fr 100px 80px;gap:10px;margin-bottom:16px;">
        <div class="form-group" style="margin:0;"><label class="form-label">When ordering…</label><select class="form-input" id="rt-trigger">${opts}</select></div>
        <div class="form-group" style="margin:0;"><label class="form-label">Min Qty</label><input class="form-input" id="rt-qty" type="number" value="5" min="1"></div>
        <div class="form-group" style="margin:0;"><label class="form-label">Unit</label><select class="form-input" id="rt-unit"><option>kg</option><option>units</option><option>litres</option></select></div>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
        <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;">Suggested Items</div>
        <button class="btn btn-s btn-sm" type="button" onclick="addSuggestRow()">+ Add Item</button>
      </div>
      <div id="suggest-rows">
        ${[1,2].map(n=>`
          <div class="form-row suggest-row" style="gap:10px;margin-bottom:8px;" id="srow-${n}">
            <div class="form-group" style="margin:0;"><select class="form-input" name="s-item">${n===2?`<option value="">— Remove —</option>`:''}<option>Garlic Mayo</option>${opts}</select></div>
            <div class="form-group" style="margin:0;flex:0 0 80px;"><input class="form-input" type="number" name="s-qty" value="${n===1?2.5:1}" min="0.5" step="0.5" placeholder="Qty"></div>
            <div class="form-group" style="margin:0;flex:0 0 80px;"><select class="form-input" name="s-unit"><option>kg</option><option>units</option></select></div>
          </div>`).join('')}
      </div>
      <div class="form-footer">
        <button class="btn btn-p" onclick="saveRecipe()">Save Template</button>
        <button class="btn btn-s" onclick="closeModal()">Cancel</button>
      </div>`;
  }

  if(type==='add-product-recipe'||type==='edit-product-recipe'){
    const isEdit=type==='edit-product-recipe';
    const pr=isEdit?S.productRecipes.find(r=>r.id===data):null;
    const ingrs=pr?pr.ingredients:[
      {name:'',qty:80,unit:'g',type:'raw'},{name:'',qty:1,unit:'units',type:'packaging',cost:5}
    ];
    return`
      <div class="modal-hd">
        <div><div class="modal-title">${isEdit?'Edit':'New'} Product Recipe</div><div class="modal-sub">Define what goes into one serving of this menu item</div></div>
        <button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 80px 60px;gap:10px;margin-bottom:14px;">
        <div class="form-group" style="margin:0;"><label class="form-label">Product Name</label><input class="form-input" id="pr-name" value="${pr?.name||''}" placeholder="e.g. Regular Shawarma"></div>
        <div class="form-group" style="margin:0;"><label class="form-label">Category</label><select class="form-input" id="pr-cat"><option>Wraps</option><option>Sides</option><option>Drinks</option><option>Combos</option></select></div>
        <div class="form-group" style="margin:0;"><label class="form-label">Selling ₹</label><input class="form-input" id="pr-price" type="number" value="${pr?.sellingPrice||180}" min="1"></div>
        <div class="form-group" style="margin:0;"><label class="form-label">Icon</label><input class="form-input" id="pr-em" value="${pr?.em||'🥙'}" maxlength="2"></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;">Ingredients</div>
        <button class="btn btn-s btn-sm" type="button" onclick="addIngredientRow()">+ Add Ingredient</button>
      </div>
      <div style="background:var(--sbdr);border-radius:7px;padding:8px 10px;margin-bottom:8px;display:grid;grid-template-columns:1fr 70px 70px 80px 28px;gap:8px;">
        <span style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;">Ingredient Name</span>
        <span style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;">Qty</span>
        <span style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;">Unit</span>
        <span style="font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;">Type</span>
        <span></span>
      </div>
      <div id="ingredient-rows" style="max-height:280px;overflow-y:auto;">
        ${ingrs.map((i,idx)=>`
          <div class="ingredient-row" style="display:grid;grid-template-columns:1fr 70px 70px 80px 28px;gap:8px;margin-bottom:6px;" id="irow-${idx}">
            <input class="form-input" name="ing-name" value="${i.name}" placeholder="e.g. Chicken Shawarma Mix" style="padding:8px 10px;font-size:13px;">
            <input class="form-input" name="ing-qty" type="number" value="${i.qty}" min="0.1" step="0.1" style="padding:8px;font-size:13px;text-align:center;">
            <select class="form-input" name="ing-unit" style="padding:8px;font-size:13px;">
              <option ${i.unit==='g'?'selected':''}>g</option>
              <option ${i.unit==='ml'?'selected':''}>ml</option>
              <option ${i.unit==='units'?'selected':''}>units</option>
              <option ${i.unit==='kg'?'selected':''}>kg</option>
            </select>
            <select class="form-input" name="ing-type" style="padding:8px;font-size:12px;">
              <option value="raw" ${i.type==='raw'?'selected':''}>Raw</option>
              <option value="packaging" ${i.type==='packaging'?'selected':''}>Packaging</option>
              <option value="condiment" ${i.type==='condiment'?'selected':''}>Condiment</option>
            </select>
            <button onclick="this.closest('.ingredient-row').remove()" style="background:var(--ember-dim);color:var(--ember);border:none;border-radius:6px;cursor:pointer;width:28px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>`).join('')}
      </div>
      <div class="form-footer">
        <button class="btn btn-p" onclick="saveProductRecipe(${isEdit?`'${pr.id}'`:'null'})">
          ${isEdit?'Save Changes':'Create Recipe'}
        </button>
        <button class="btn btn-s" onclick="closeModal()">Cancel</button>
      </div>`;
  }

  return`<div class="modal-hd"><div class="modal-title">Modal</div><button class="modal-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div><p>Content</p>`;
}

// ── Fulfill with edit ──
function openFulfillModal(id,ev){
  if(ev) ev.stopPropagation();
  openModal('fulfill-order',id);
}
function confirmFulfill(id,originalItems){
  const o=S.orders.find(x=>x.id===id);
  if(!o) return;
  // Read quantities from inputs
  const rows=document.querySelectorAll('[id^="ful-q-"]');
  const fulfilled=originalItems.map((item,idx)=>{
    const inp=document.getElementById('ful-q-'+idx);
    const q=inp?parseFloat(inp.value)||0:item.q;
    return{...item,q};
  }).filter(i=>i.q>0);
  const sub=fulfilled.reduce((s,i)=>s+i.q*i.p,0);
  const gst=Math.round(sub*.05);
  o.itemList=fulfilled;
  o.items=fulfilled.length;
  o.amt=sub+gst;
  o.status='fulfilled';
  invCounter++;
  const invId='INV-0'+invCounter;
  o.invoiceId=invId;
  S.pending.push({id:'P'+Date.now(),inv:invId,fid:o.fid,fr:o.fr,oid:o.id,amt:o.amt,due:'2 Aug 2026',status:'pending',reminderSent:false});
  const changed=fulfilled.some((fi,idx)=>fi.q!==originalItems[idx]?.q);
  closeModal();updateBadges();render();
  toast(`⚡ #${id} fulfilled${changed?' (quantities adjusted)':''} — Invoice ${invId} generated & sent to ${o.fr}`);
}

// ── Ordering template ──
function addSuggestRow(){
  const container=document.getElementById('suggest-rows');
  if(!container) return;
  const n=container.querySelectorAll('.suggest-row').length+1;
  const opts=S.inventory.filter(i=>i.status==='active').map(i=>`<option>${i.name}</option>`).join('');
  const div=document.createElement('div');
  div.className='form-row suggest-row';
  div.style.cssText='gap:10px;margin-bottom:8px;';
  div.innerHTML=`
    <div class="form-group" style="margin:0;"><select class="form-input" name="s-item"><option value="">— Remove —</option>${opts}</select></div>
    <div class="form-group" style="margin:0;flex:0 0 80px;"><input class="form-input" type="number" name="s-qty" value="1" min="0.5" step="0.5"></div>
    <div class="form-group" style="margin:0;flex:0 0 80px;"><select class="form-input" name="s-unit"><option>kg</option><option>units</option></select></div>
    <button onclick="this.closest('.suggest-row').remove()" style="background:var(--ember-dim);color:var(--ember);border:none;border-radius:6px;cursor:pointer;padding:8px 10px;font-size:12px;font-weight:600;white-space:nowrap;">Remove</button>`;
  container.appendChild(div);
}

// ── Product recipe ──
function addIngredientRow(){
  const container=document.getElementById('ingredient-rows');
  if(!container) return;
  const idx=container.querySelectorAll('.ingredient-row').length;
  const div=document.createElement('div');
  div.className='ingredient-row';
  div.style.cssText='display:grid;grid-template-columns:1fr 70px 70px 80px 28px;gap:8px;margin-bottom:6px;';
  div.innerHTML=`
    <input class="form-input" name="ing-name" value="" placeholder="Ingredient name" style="padding:8px 10px;font-size:13px;">
    <input class="form-input" name="ing-qty" type="number" value="1" min="0.1" step="0.1" style="padding:8px;font-size:13px;text-align:center;">
    <select class="form-input" name="ing-unit" style="padding:8px;font-size:13px;"><option>g</option><option>ml</option><option>units</option><option>kg</option></select>
    <select class="form-input" name="ing-type" style="padding:8px;font-size:12px;"><option value="raw">Raw</option><option value="packaging">Packaging</option><option value="condiment">Condiment</option></select>
    <button onclick="this.closest('.ingredient-row').remove()" style="background:var(--ember-dim);color:var(--ember);border:none;border-radius:6px;cursor:pointer;width:28px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>`;
  container.appendChild(div);
}

function saveProductRecipe(editId){
  const name=document.getElementById('pr-name')?.value?.trim();
  const price=parseFloat(document.getElementById('pr-price')?.value||0);
  const cat=document.getElementById('pr-cat')?.value||'Wraps';
  const em=document.getElementById('pr-em')?.value||'🥙';
  if(!name||!price){toast('⚠️ Name and selling price required');return;}
  const rows=document.querySelectorAll('#ingredient-rows .ingredient-row');
  const ingredients=Array.from(rows).map(row=>({
    name:row.querySelector('[name="ing-name"]')?.value?.trim()||'',
    qty:parseFloat(row.querySelector('[name="ing-qty"]')?.value||0),
    unit:row.querySelector('[name="ing-unit"]')?.value||'g',
    type:row.querySelector('[name="ing-type"]')?.value||'raw',
    invId:S.inventory.find(i=>i.name===row.querySelector('[name="ing-name"]')?.value?.trim())?.id||null,
    cost:row.querySelector('[name="ing-type"]')?.value==='packaging'?1:undefined,
  })).filter(i=>i.name&&i.qty>0);
  if(ingredients.length===0){toast('⚠️ Add at least one ingredient');return;}
  if(editId){
    const pr=S.productRecipes.find(r=>r.id===editId);
    if(pr){Object.assign(pr,{name,sellingPrice:price,category:cat,em,ingredients});}
  } else {
    S.productRecipes.push({id:'pr'+Date.now(),name,sellingPrice:price,category:cat,em,ingredients});
  }
  closeModal();render();toast(`✅ "${name}" recipe ${editId?'updated':'created'}`);
}

// ── Modal actions ──
function saveNewItem(){
  const name=document.getElementById('ni-name')?.value?.trim();
  const price=parseFloat(document.getElementById('ni-price')?.value||0);
  const unit=document.getElementById('ni-unit')?.value||'kg';
  const em=document.getElementById('ni-em')?.value||'📦';
  const status=document.getElementById('ni-status')?.value||'active';
  if(!name||!price){toast('⚠️ Name and price are required');return;}
  S.inventory.push({id:'i'+Date.now(),name,price,unit,status,em});
  closeModal();render();toast(`✅ "${name}" added to inventory`);
}
function saveEditItem(id){
  const item=S.inventory.find(i=>i.id===id);
  if(!item) return;
  item.name=document.getElementById('ei-name')?.value||item.name;
  item.price=parseFloat(document.getElementById('ei-price')?.value)||item.price;
  item.unit=document.getElementById('ei-unit')?.value||item.unit;
  item.em=document.getElementById('ei-em')?.value||item.em;
  item.status=document.getElementById('ei-status')?.value||item.status;
  closeModal();render();toast(`✅ "${item.name}" updated`);
}
function createFranchise(){
  const name=document.getElementById('nf-name')?.value?.trim();
  const owner=document.getElementById('nf-owner')?.value?.trim();
  const email=document.getElementById('nf-email')?.value?.trim();
  const phone=document.getElementById('nf-phone')?.value?.trim();
  if(!name||!owner||!email){toast('⚠️ Name, owner and email are required');return;}
  const id='F'+Date.now();
  const loginId=name.toLowerCase().replace(/ /g,'.')+Math.floor(Math.random()*900+100);
  S.franchises.push({id,name,owner,email,phone,status:'active',since:'Jul 2026',orders:0,revenue:0});
  closeModal();render();
  toast(`✅ ${name} created! Login: ${loginId}@sha3 — credentials emailed to ${email}`);
}
function approveAmend(id){
  const o=S.orders.find(x=>x.id===id);
  if(!o||!o.amendment) return;
  invCounter++;
  const invId='INV-0'+invCounter;
  o.itemList=o.amendment.items;
  const sub=o.amendment.items.reduce((s,i)=>s+i.q*i.p,0);
  o.amt=Math.round(sub*1.05);
  o.status='fulfilled';
  o.invoiceId=invId;
  o.amendment=null;
  closeModal();updateBadges();render();
  toast(`✅ Amendment approved — New invoice ${invId} generated & sent to ${o.fr}`);
}
function rejectAmend(id){
  const o=S.orders.find(x=>x.id===id);
  if(o){o.status='pending';o.amendment=null;}
  closeModal();updateBadges();render();
  toast(`Amendment rejected — #${id} reverted to pending`);
}
function saveRecipe(){
  const trigger=document.getElementById('rt-trigger')?.value;
  const tQty=parseFloat(document.getElementById('rt-qty')?.value)||5;
  const tUnit=document.getElementById('rt-unit')?.value||'kg';
  if(!trigger){toast('⚠️ Select a trigger item');return;}
  const rows=document.querySelectorAll('#suggest-rows .suggest-row');
  const suggests=Array.from(rows).map(row=>({
    item:row.querySelector('[name="s-item"]')?.value||'',
    qty:parseFloat(row.querySelector('[name="s-qty"]')?.value)||1,
    unit:row.querySelector('[name="s-unit"]')?.value||'kg',
  })).filter(s=>s.item&&s.item!=='— Remove —');
  if(suggests.length===0){toast('⚠️ Add at least one suggested item');return;}
  S.recipes.push({id:'r'+Date.now(),trigger,tQty,tUnit,suggests});
  closeModal();render();toast('✅ Ordering template saved');
}

// ══════════════════════════════════════
// TOAST + SEARCH
// ══════════════════════════════════════
let _tt;
function toast(msg){
  const t=document.getElementById('toast-el');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),3500);
}
function handleGlobalSearch(v){
  if(!v) return;
  const ord=S.orders.find(o=>o.id.toLowerCase().includes(v.toLowerCase()));
  if(ord){S.ordFil.search=v;go('orders');}
}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
updateBadges();render();
</script>
