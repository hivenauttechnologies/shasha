<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sha Sha Shandaar Shawarma</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --sf:#E8A838;--sf-dim:#FFF3DC;--ember:#C23B22;--ember-dim:#FEE2E2;
  --coal:#1B1B2F;--coal2:#2D2D4E;--cream:#FFFAF3;
  --sage:#27AE60;--sage-dim:#EAFAF1;--sky:#2D9CDB;--sky-dim:#EBF5FB;
  --txt:#1B1B2F;--muted:#6B7280;--bdr:#E5E7EB;--wh:#fff;
  --R:14px;--BNH:64px;--HH:56px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Inter',sans-serif;background:#d0d0d0;
  display:flex;justify-content:center;align-items:center;}
#app{width:390px;height:844px;background:var(--cream);border-radius:44px;
  overflow:hidden;position:relative;display:flex;flex-direction:column;
  box-shadow:0 40px 100px rgba(0,0,0,0.4),0 0 0 11px #111,0 0 0 13px #444;}

/* HEADER */
.hd{height:var(--HH);background:var(--coal);display:flex;align-items:center;
  padding:0 16px;flex-shrink:0;z-index:10;gap:10px;}
.hd-brand{font-family:'Poppins',sans-serif;font-weight:800;font-size:13.5px;
  color:var(--sf);line-height:1.2;flex:1;}
.hd-title{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;
  color:var(--wh);flex:1;}
.hd-btn{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,0.09);
  border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,0.7);flex-shrink:0;}
.hd-btn:active{opacity:.6;}
.hd-btn .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;
  background:var(--ember);border-radius:50%;border:1.5px solid var(--coal);}
.hd-btn{position:relative;}

/* CONTENT */
.cnt{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;background:var(--cream);}
.cnt::-webkit-scrollbar{display:none;}

/* BOTTOM NAV */
.bn{height:var(--BNH);background:var(--wh);border-top:1px solid var(--bdr);
  display:flex;flex-shrink:0;}
.nv{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;cursor:pointer;border:none;background:none;
  color:var(--muted);font-size:10px;font-family:'Inter',sans-serif;font-weight:500;}
.nv svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;}
.nv.active{color:var(--sf);}
.nv:active{opacity:.6;}
.nv .nb{background:var(--ember);color:#fff;font-size:9px;font-weight:700;
  padding:1px 5px;border-radius:8px;margin-top:-2px;line-height:1.4;}

/* FAB */
.fab{position:absolute;bottom:calc(var(--BNH)+14px);right:16px;
  width:52px;height:52px;border-radius:16px;background:var(--sf);
  border:none;cursor:pointer;display:none;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(232,168,56,.5);z-index:5;color:var(--coal);}
.fab:active{transform:scale(.94);}

/* BOTTOM SHEET */
.ov{position:absolute;inset:0;background:rgba(27,27,47,.55);
  z-index:100;display:none;align-items:flex-end;}
.ov.on{display:flex;}
.bs{width:100%;background:var(--wh);border-radius:20px 20px 0 0;
  padding:20px 20px 40px;max-height:88%;overflow-y:auto;}
.bs::-webkit-scrollbar{display:none;}
.bsh{width:36px;height:4px;background:var(--bdr);border-radius:2px;margin:0 auto 16px;}
.bst{font-family:'Poppins',sans-serif;font-weight:700;font-size:18px;margin-bottom:14px;}

/* CARDS */
.card{background:var(--wh);border-radius:var(--R);border:1px solid var(--bdr);margin-bottom:12px;overflow:hidden;}
.cb{padding:14px 16px;}

/* BUTTONS */
.btn{font-family:'Inter',sans-serif;font-weight:600;border:none;cursor:pointer;
  border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.btn:active{opacity:.72;}
.btn-p{background:var(--sf);color:var(--coal);}
.btn-s{background:var(--wh);color:var(--txt);border:1.5px solid var(--bdr);}
.btn-d{background:var(--ember-dim);color:var(--ember);}
.btn-g{background:var(--sage-dim);color:var(--sage);}
.btn-sky{background:var(--sky-dim);color:var(--sky);border:1.5px solid #bee3f8;}
.btn-full{width:100%;padding:14px;font-size:15px;border-radius:12px;}
.btn-sm{padding:7px 14px;font-size:12.5px;border-radius:8px;}
.btn-md{padding:10px 18px;font-size:13.5px;}

/* BADGES */
.bge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.bg-pending{background:#FEF3C7;color:#B45309;}
.bg-fulfilled{background:#DBEAFE;color:#1D4ED8;}
.bg-delivered{background:var(--sage-dim);color:var(--sage);}
.bg-amended{background:#EDE9FE;color:#6D28D9;}
.bg-paid{background:var(--sage-dim);color:var(--sage);}
.bg-unpaid{background:var(--ember-dim);color:var(--ember);}
.bg-overdue{background:var(--ember-dim);color:var(--ember);}

/* CHIPS */
.cr{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-bottom:14px;scrollbar-width:none;}
.cr::-webkit-scrollbar{display:none;}
.chip{padding:7px 15px;border-radius:20px;font-size:12.5px;font-weight:600;
  white-space:nowrap;cursor:pointer;border:1.5px solid var(--bdr);
  background:var(--wh);color:var(--muted);flex-shrink:0;}
.chip.on{background:var(--sf);color:var(--coal);border-color:var(--sf);}
.chip:active{opacity:.7;}

/* STATS */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.sc{background:var(--wh);border-radius:var(--R);border:1px solid var(--bdr);
  padding:14px;cursor:pointer;}
.sc:active{background:#fafafa;}
.sl{font-size:10.5px;font-weight:600;color:var(--muted);text-transform:uppercase;
  letter-spacing:.05em;margin-bottom:6px;}
.sv{font-family:'Poppins',sans-serif;font-weight:700;font-size:22px;line-height:1;}
.ss{font-size:11px;margin-top:4px;font-weight:600;}
.up{color:var(--sage);}.dn{color:var(--ember);}.nt{color:var(--muted);}

/* FORM */
.fl{font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;display:block;
  text-transform:uppercase;letter-spacing:.05em;}
.fi{width:100%;padding:11px 13px;border:1.5px solid var(--bdr);border-radius:10px;
  font-family:'Inter',sans-serif;font-size:14px;background:var(--wh);color:var(--txt);
  -webkit-appearance:none;appearance:none;}
.fi:focus{outline:none;border-color:var(--sf);}
.fg{margin-bottom:12px;}

/* ORDER ROW */
.or{padding:14px 16px;border-bottom:1px solid var(--bdr);cursor:pointer;
  display:flex;align-items:center;gap:12px;}
.or:last-child{border-bottom:none;}
.or:active{background:#f9fafb;}
.oi{flex:1;}
.oid{font-weight:700;font-size:14px;}
.om{font-size:12px;color:var(--muted);margin-top:2px;}

/* CATALOG */
.ci{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bdr);gap:12px;}
.ci:last-child{border-bottom:none;}
.cic{width:42px;height:42px;border-radius:12px;background:var(--sf-dim);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.cn{font-weight:600;font-size:14px;}
.cp{font-size:12px;color:var(--muted);margin-top:2px;}
.qc{display:flex;align-items:center;gap:8px;}
.qb{width:30px;height:30px;border-radius:8px;border:none;cursor:pointer;
  font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;}
.qb.minus{background:var(--bdr);color:var(--txt);}
.qb.plus{background:var(--sf);color:var(--coal);}
.qb:active{opacity:.7;}
.qv{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;min-width:24px;text-align:center;}
.afb{background:var(--sf-dim);color:var(--sf);border:1.5px dashed var(--sf);
  width:32px;height:32px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:18px;cursor:pointer;}
.afb:active{opacity:.7;}

/* SUMMARY ROW */
.sr{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;
  border-bottom:1px solid var(--bdr);}
.sr:last-child{border-bottom:none;}
.sr.tot{font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;}

/* SUGGESTION */
.sug{background:var(--sf-dim);border:1px dashed var(--sf);border-radius:12px;
  padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;}
.sug-tag{font-size:10px;background:var(--sf);color:var(--coal);
  padding:2px 7px;border-radius:6px;font-weight:700;display:inline-block;margin-bottom:3px;}

/* NOTIF */
.ni{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--bdr);}
.ni:last-child{border-bottom:none;}
.ni.unr{background:#fffbf0;}
.ndot{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.nd-info{background:var(--sky);}
.nd-warn{background:var(--sf);}
.nd-error{background:var(--ember);}
.nd-success{background:var(--sage);}

/* INVENTORY */
.ii{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bdr);gap:12px;}
.ii:last-child{border-bottom:none;}
.ibw{height:6px;background:var(--bdr);border-radius:4px;margin-top:5px;}
.ib{height:100%;border-radius:4px;}
.ist{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.in-s{background:var(--sage-dim);color:var(--sage);}
.lo-s{background:var(--sf-dim);color:#B45309;}
.ou-s{background:var(--ember-dim);color:var(--ember);}

/* RECONCILE */
.rci{padding:12px 16px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:10px;}
.rci:last-child{border-bottom:none;}
.rcb{width:30px;height:30px;border-radius:8px;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.rcb.ok{background:var(--sage-dim);color:var(--sage);}
.rcb.fl{background:var(--ember-dim);color:var(--ember);}

/* WASTAGE */
.wi{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bdr);gap:12px;}
.wi:last-child{border-bottom:none;}

/* PNL */
.prow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bdr);font-size:13.5px;}
.prow:last-child{border-bottom:none;}
.prow.ph{font-weight:700;font-size:14px;}
.pos{color:var(--sage);font-weight:600;}
.neg{color:var(--ember);font-weight:600;}

/* CHART */
.chrt{display:flex;align-items:flex-end;gap:5px;height:80px;}
.chrt-b{flex:1;border-radius:4px 4px 0 0;}

/* REPORT BAR */
.rb{padding:11px 0;border-bottom:1px solid var(--bdr);}
.rb:last-child{border-bottom:none;}
.rb-h{display:flex;justify-content:space-between;margin-bottom:5px;font-size:13px;font-weight:600;}
.rb-t{height:6px;background:var(--bdr);border-radius:3px;}
.rb-f{height:100%;border-radius:3px;background:var(--sf);}

/* DETAIL ITEM */
.di{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bdr);}
.di:last-child{border-bottom:none;}

/* SECTION HEADER */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.st{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;color:var(--txt);}
.sa{font-size:12.5px;font-weight:600;color:var(--sf);background:none;border:none;cursor:pointer;}

/* PROGRESS */
.pr-r{margin-bottom:14px;}
.pr-l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;font-weight:500;}
.pr-t{height:8px;background:var(--bdr);border-radius:4px;}
.pr-f{height:100%;border-radius:4px;}

/* TOAST */
.toast{position:absolute;bottom:calc(var(--BNH)+12px);left:12px;right:12px;
  background:var(--coal);color:var(--wh);padding:13px 16px;border-radius:12px;
  font-size:13.5px;font-weight:500;display:none;z-index:200;
  box-shadow:0 8px 24px rgba(0,0,0,.2);align-items:center;gap:10px;}
.toast.on{display:flex;}

/* MISC */
.dvd{height:1px;background:var(--bdr);margin:12px 0;}
.pay-card{background:var(--wh);border-radius:var(--R);border:1px solid var(--bdr);padding:16px;margin-bottom:12px;}
.pay-card.ov{border-color:var(--ember);}
.emp{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px;}
.emp .em{font-size:36px;margin-bottom:10px;}
.sec{padding:16px;}
.sec>*+*{margin-top:0;}
.more-row{padding:15px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:14px;cursor:pointer;}
.more-row:last-child{border-bottom:none;}
.more-row:active{background:#fafafa;}
.more-ico{width:44px;height:44px;border-radius:12px;background:var(--sf-dim);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
</style>
</head>
<body>
<div id="app">
  <header class="hd" id="hd"></header>
  <div class="cnt" id="cnt"></div>
  <nav class="bn" id="bn">
    <button class="nv active" id="nv-home" onclick="nav('home')">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>Home
    </button>
    <button class="nv" id="nv-orders" onclick="nav('orders')">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>Orders
    </button>
    <button class="nv" id="nv-finance" onclick="nav('finance')">
      <svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Finance
    </button>
    <button class="nv" id="nv-ops" onclick="nav('ops')">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 002 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>Ops
    </button>
    <button class="nv" id="nv-more" onclick="nav('more')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>More
    </button>
  </nav>
  <button class="fab" id="fab" onclick="nav('new-order')">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
  </button>

  <!-- SHEETS -->
  <div class="ov" id="sh-deliver" onclick="if(event.target===this)cls('sh-deliver')">
    <div class="bs" id="sh-deliver-body"></div>
  </div>



  <div class="ov" id="sh-pay" onclick="if(event.target===this)cls('sh-pay')">
    <div class="bs"><div class="bsh"></div><div class="bst">Make Payment</div>
      <div id="sh-pay-amt"></div>
      <div class="fg" style="margin-top:12px;"><label class="fl">Payment Method</label>
        <select class="fi" id="pay-method"><option>UPI</option><option>Bank Transfer</option><option>Credit Card</option></select></div>
      <div class="fg"><label class="fl">UPI ID</label><input type="text" class="fi" value="rajesh.koramangala@okaxis"></div>
      <button class="btn btn-p btn-full" id="pay-go-btn">Confirm Payment</button>
    </div>
  </div>

  <div class="ov" id="sh-waste" onclick="if(event.target===this)cls('sh-waste')">
    <div class="bs"><div class="bsh"></div><div class="bst">Log Wastage</div>
      <div class="fg"><label class="fl">Item</label><select class="fi" id="w-item">
        <option>Chicken Shawarma Mix</option><option>Pita Bread</option><option>Garlic Mayo</option>
        <option>French Fries</option><option>Tahini</option><option>Peri Peri Sauce</option>
      </select></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="fg"><label class="fl">Quantity</label><input type="number" class="fi" id="w-qty" value="1" min="0.5" step="0.5"></div>
        <div class="fg"><label class="fl">Unit</label><select class="fi" id="w-unit"><option>kg</option><option>units</option></select></div>
      </div>
      <div class="fg"><label class="fl">Reason</label><select class="fi" id="w-reason">
        <option>Expired</option><option>Spoiled</option><option>Damaged in transit</option><option>Overproduction</option><option>Other</option>
      </select></div>
      <button class="btn btn-p btn-full" onclick="doWaste()">Log Wastage</button>
    </div>
  </div>

  <div class="ov" id="sh-confirm" onclick="if(event.target===this)cls('sh-confirm')">
    <div class="bs"><div class="bsh"></div><div class="bst">Review Your Order</div>
      <div id="sh-confirm-body"></div>
      <button class="btn btn-p btn-full" style="margin-top:16px;" onclick="doPlaceOrder()">Place Order</button>
      <button class="btn btn-s btn-full" style="margin-top:8px;" onclick="cls('sh-confirm')">Back to Edit</button>
    </div>
  </div>

  <div class="ov" id="sh-expense" onclick="if(event.target===this)cls('sh-expense')">
    <div class="bs">
      <div class="bsh"></div>
      <div class="bst">Add Expense</div>
      <div class="fg">
        <label class="fl">Category</label>
        <select class="fi" id="exp-cat">
          <option>Rent &amp; Utilities</option>
          <option>Staff / Labour</option>
          <option>Transport</option>
          <option>Packaging</option>
          <option>Marketing</option>
          <option>Equipment Repair</option>
          <option>Cleaning</option>
          <option>Licensing</option>
          <option>Miscellaneous</option>
        </select>
      </div>
      <div class="fg">
        <label class="fl">Amount (₹)</label>
        <input type="number" class="fi" id="exp-amt" placeholder="e.g. 5000" min="1" step="1">
      </div>
      <div class="fg">
        <label class="fl">Date</label>
        <input type="date" class="fi" id="exp-date" value="2026-07-26">
      </div>
      <div class="fg">
        <label class="fl">Notes</label>
        <textarea class="fi" id="exp-notes" rows="2" style="resize:none;" placeholder="What was this expense for?"></textarea>
      </div>
      <button class="btn btn-p btn-full" onclick="doExpense()">Save Expense</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
// ── DATA ──
const catalog=[
  {id:'c1',name:'Chicken Shawarma Mix',price:300,unit:'kg',em:'🍖',cat:'Meat'},
  {id:'c2',name:'Pita Bread',price:15,unit:'units',em:'🫓',cat:'Bread'},
  {id:'c3',name:'Garlic Mayo',price:200,unit:'kg',em:'🧄',cat:'Sauce'},
  {id:'c4',name:'Peri Peri Sauce',price:300,unit:'kg',em:'🌶️',cat:'Sauce'},
  {id:'c5',name:'French Fries',price:120,unit:'kg',em:'🍟',cat:'Sides'},
  {id:'c6',name:'Hummus',price:350,unit:'kg',em:'🫙',cat:'Dips'},
  {id:'c7',name:'Tahini',price:450,unit:'kg',em:'🥗',cat:'Sauce'},
  {id:'c8',name:'Pickled Turnips',price:180,unit:'kg',em:'🥒',cat:'Sides'},
];
const recipes={
  c1:[{id:'c3',label:'Pairs with Chicken'},{id:'c4',label:'Recommended pairing'}],
  c2:[{id:'c6',label:'Suggested for Pita'}],
  c6:[{id:'c7',label:'Classic hummus combo'}],
};
const pxMap={'Chicken Shawarma Mix':300,'Pita Bread':15,'Garlic Mayo':200,'French Fries':120,'Tahini':450,'Peri Peri Sauce':300,'Pickled Turnips':180,'Hummus':350};

const S={
  screen:'home', sub:null,
  oFilter:'all', catFilter:'All', finTab:'payments', opsTab:'inventory', rptTab:'item',
  cart:[], selOrder:null, selPay:null,
  recFlags:{},
  expCatFilter:'All',
  yieldSales:{},   // productRecipeId → units sold (manual entry)

  productRecipes:[
    {id:'pr1',name:'Regular Shawarma',sellingPrice:180,em:'🥙',
      ingredients:[
        {name:'Chicken Shawarma Mix',qty:80,unit:'g',invId:'i1'},
        {name:'Garlic Mayo',qty:30,unit:'g',invId:'i3'},
        {name:'Tahini',qty:10,unit:'g',invId:'i7'},
        {name:'Shawarma Box',qty:1,unit:'units',invId:null,cost:5},
        {name:'Silver Foil',qty:1,unit:'units',invId:null,cost:1.5},
        {name:'Sauce Pack',qty:1,unit:'units',invId:null,cost:2},
        {name:'Tissue',qty:1,unit:'units',invId:null,cost:0.5},
      ]},
    {id:'pr2',name:'Pita Pocket',sellingPrice:140,em:'🫓',
      ingredients:[
        {name:'Pita Bread',qty:1,unit:'units',invId:'i2'},

// ── NAVIGATION ──
const MAIN=['home','orders','finance','ops','more'];
function nav(sc,sub){
  S.screen=sc; S.sub=sub||null;
  const isMain=MAIN.includes(sc);
  MAIN.forEach(t=>{
    const b=document.getElementById('nv-'+t);
    if(b) b.classList.toggle('active',t===sc);
  });
  const fab=document.getElementById('fab');
  const bn=document.getElementById('bn');
  fab.style.display=(sc==='orders')?'flex':'none';
  bn.style.display=isMain?'flex':'none';
  if(!isMain){
    // update nav active for sub-screens
    const parent={
      'new-order':'orders','order-detail':'orders','amend-order':'orders',
      'reconcile-detail':'ops','reports':'more','notifications':'more','pnl':'finance'
    }[sc];
    if(parent){
      const pb=document.getElementById('nv-'+parent);
      if(pb) pb.classList.add('active');
    }
  }
  render();
  document.getElementById('cnt').scrollTop=0;
}

function goBack(){
  const sc=S.screen;
  if(sc==='new-order'||sc==='orders') nav('orders');
  else if(sc==='amend-order'||sc==='order-detail') { S.cart=[]; nav('order-detail'); }
  else if(sc==='reconcile-detail') nav('ops');
  else if(sc==='pnl') nav('finance');
  else nav('more');
}

    paid:['bg-paid','Paid'],unpaid:['bg-unpaid','Unpaid'],overdue:['bg-overdue','Overdue'],

  return`<span class="bge ${cls}">${lbl}</span>`;
}

function addToCart(id){
  const it=catalog.find(c=>c.id===id);
  if(!it)return;
  if(!S.cart.find(c=>c.id===id)) S.cart.push({id,name:it.name,qty:1,unit:it.unit,price:it.price});
  render();
}
function changeQty(id,d){
  const i=S.cart.findIndex(c=>c.id===id);
  if(i===-1){addToCart(id);return;}
  S.cart[i].qty=Math.max(0,S.cart[i].qty+d);
  if(S.cart[i].qty===0) S.cart.splice(i,1);
  render();
}
function openConfirm(){
  const sub=S.cart.reduce((s,c)=>s+c.qty*c.price,0);
  const gst=Math.round(sub*.05);
  document.getElementById('sh-confirm-body').innerHTML=`
    ${S.cart.map(c=>`<div class="sr"><span>${c.name} × ${c.qty} ${c.unit}</span><span>₹${(c.qty*c.price).toLocaleString()}</span></div>`).join('')}
    <div class="sr"><span style="color:var(--muted)">GST (5%)</span><span>₹${gst.toLocaleString()}</span></div>
    <div class="sr tot"><span>Total</span><span>₹${(sub+gst).toLocaleString()}</span></div>`;
  ops('sh-confirm');
}
function doPlaceOrder(){
  const sub=S.cart.reduce((s,c)=>s+c.qty*c.price,0);
  const gst=Math.round(sub*.05);
  const newO={
    id:'ORD-'+(1043+S.orders.length),date:'26 Jul 2026',
    items:S.cart.map(c=>({name:c.name,qty:c.qty,unit:c.unit,price:c.price,total:c.qty*c.price})),
    subtotal:sub,gst,total:sub+gst,status:'pending',pay:'unpaid'
  };
  S.orders.unshift(newO);
  S.cart=[];S.catFilter='All';
  cls('sh-confirm');
  nav('orders');
  setTimeout(()=>toast('✅ Order placed — #'+newO.id),200);
}

// ── YIELD ANALYSIS ──
function rYield(){
  // Helper: get max yield of a product recipe from current inventory
  function calcYield(pr){
    const limits=[];
    pr.ingredients.forEach(ing=>{
      if(!ing.invId) return;
      const stock=S.inv.find(i=>i.name===ing.name);
      if(!stock) return;
      // Convert stock (kg/units) to ingredient unit (g/units)
      let stockInUnit=stock.stock;
      if(stock.unit==='kg'&&ing.unit==='g') stockInUnit=stock.stock*1000;
      else if(stock.unit==='kg'&&ing.unit==='kg') stockInUnit=stock.stock;
      limits.push({name:ing.name,max:Math.floor(stockInUnit/ing.qty)});
    });
    if(limits.length===0) return {max:0,bottleneck:'No linked inventory'};
    const min=limits.reduce((a,b)=>a.max<b.max?a:b);
    return{max:min.max,bottleneck:min.name,limits};
  }

  // Helper: calc cost per serving
  function calcCost(pr){
    let raw=0,pkg=0;
    pr.ingredients.forEach(ing=>{
      if(ing.invId){
        const invItem=S.inv.find(i=>i.name===ing.name);
        if(invItem){
          const cpp=invItem.unit==='kg'?invItem.price/1000:(invItem.unit==='units'?invItem.price:invItem.price/1000);
          raw+=cpp*ing.qty;
        }
      } else if(ing.cost){
        pkg+=ing.cost;
      }
    });
    return{raw,pkg,total:raw+pkg};
  }

  return`
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:14px;line-height:1.5;">
      Enter units sold/produced to see expected raw material usage vs actual stock.
    </div>

    ${S.productRecipes.map(pr=>{
      const y=calcYield(pr);
      const cost=calcCost(pr);
      const margin=pr.sellingPrice-cost.total;
      const sold=S.yieldSales[pr.id]||0;
      const expectedUsage=pr.ingredients.filter(i=>i.invId).map(ing=>{
        let used=sold*ing.qty;
        let unit=ing.unit;
        if(ing.unit==='g'){used=used/1000;unit='kg';}
        return{name:ing.name,used:used.toFixed(2),unit};
      });
      return`
        <div class="card" style="margin-bottom:12px;">
          <div class="cb">
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
              <span style="font-size:28px;">${pr.em}</span>
              <div style="flex:1;">
                <div style="font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;">${pr.name}</div>
                <div style="font-size:12px;color:var(--muted);">Selling: ₹${pr.sellingPrice} · Cost: ₹${cost.total.toFixed(1)} · Margin: ₹${margin.toFixed(1)}</div>
              </div>
            </div>

            <!-- Yield from stock -->
            <div style="background:${y.max>50?'var(--sage-dim)':y.max>10?'var(--sf-dim)':'var(--ember-dim)'};border-radius:10px;padding:10px 14px;margin-bottom:12px;">
              <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;">Yield from current stock</div>
              <div style="font-family:'Poppins',sans-serif;font-weight:800;font-size:24px;color:${y.max>50?'var(--sage)':y.max>10?'#B45309':'var(--ember)'};">${y.max} units</div>
              <div style="font-size:12px;color:var(--muted);margin-top:3px;">Bottleneck: ${y.bottleneck}</div>
            </div>

            <!-- Sold today input -->
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;">
              <div style="flex:1;">
                <label style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px;">Units Sold / Produced Today</label>
                <input type="number" class="fi" value="${sold}" min="0" placeholder="0"
                  oninput="S.yieldSales['${pr.id}']=parseInt(this.value)||0;render()"
                  style="padding:9px 12px;font-size:14px;font-family:'Poppins',sans-serif;font-weight:700;">
              </div>
              ${sold>0?`<div style="text-align:right;">
                <div style="font-size:11px;font-weight:700;color:var(--muted);">Expected Revenue</div>
                <div style="font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;color:var(--sage);">₹${(sold*pr.sellingPrice).toLocaleString()}</div>
              </div>`:''}
            </div>

            ${sold>0?`
              <!-- Expected usage -->
              <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;">Expected Raw Material Usage (${sold} units)</div>
              ${expectedUsage.map(eu=>{
                const stockItem=S.inv.find(i=>i.name===eu.name);
                const stockKg=stockItem?stockItem.stock:0;
                const pct=stockKg>0?Math.min(100,Math.round(parseFloat(eu.used)/stockKg*100)):100;
                const overUsed=parseFloat(eu.used)>stockKg;
                return`<div style="margin-bottom:8px;">
                  <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px;">
                    <span style="font-weight:600;">${eu.name}</span>
                    <span style="color:${overUsed?'var(--ember)':'var(--txt)'};font-weight:${overUsed?700:400};">${eu.used} ${eu.unit}${overUsed?' ⚠️ exceeds stock!':''}</span>
                  </div>
                  <div style="height:5px;background:var(--bdr);border-radius:3px;"><div style="width:${pct}%;height:100%;background:${overUsed?'var(--ember)':'var(--sf)'};border-radius:3px;"></div></div>
                </div>`;}).join('')}

              <!-- Wastage check -->
              <div style="background:var(--sky-dim);border-radius:8px;padding:10px 12px;margin-top:8px;font-size:12.5px;">
                <div style="font-weight:700;color:var(--sky);margin-bottom:3px;">💡 Minimum yield check</div>
                <div style="color:var(--txt);">
                  If you had <strong>${y.max}</strong> units possible but only sold <strong>${sold}</strong>, the gap of <strong>${Math.max(0,y.max-sold)}</strong> units may indicate wastage or production issues.
                  ${y.max>0&&sold<y.max*0.8?`<br><span style="color:var(--ember);font-weight:600;">⚠️ Only ${Math.round(sold/y.max*100)}% efficiency — review wastage.</span>`:''}
                </div>
              </div>`:''}
          </div>
        </div>`;}).join('')}
    <div style="height:8px;"></div>`;
}

        </div>`).join('')}
    </div>
    <div class="fg"><label class="fl">Delivery Date</label><input type="date" class="fi" id="del-dt" value="2026-07-26"></div>
    <button class="btn btn-g btn-full" onclick="doDeliver()">Confirm Delivery & Reconcile</button>
  `;
  ops('sh-deliver');
}

function highlightRecvRow(idx,ordered,received,unit){
  const row=document.getElementById('recv-row-'+idx);
  const inp=document.getElementById('recv-'+idx);
  const diff=parseFloat(received)-parseFloat(ordered);
  if(!row||!inp) return;
  if(Math.abs(diff)<0.01){
    row.style.background='';
    inp.style.borderColor='var(--bdr)';
  } else {
    row.style.background=diff<0?'rgba(194,59,34,.05)':'rgba(39,174,96,.05)';
    inp.style.borderColor=diff<0?'var(--ember)':'var(--sage)';
  }
}

function doDeliver(){
  const o=S.orders.find(x=>x.id===S.selOrder);
  if(!o) return;
  o.status='delivered';
  // Build reconciliation from inputs
  o.ri=o.items.map((item,idx)=>{
    const inp=document.getElementById('recv-'+idx);
    const got=inp?parseFloat(inp.value)||item.qty:item.qty;
    const diff=got-item.qty;
    const ok=Math.abs(diff)<0.01;
    return{n:item.name,ord:`${item.qty} ${item.unit}`,got:`${got} ${item.unit}`,ok,diff:diff>0?`+${diff} ${item.unit}`:`${diff} ${item.unit}`};
  });
  o.reconciled=true;
  const bad=o.ri.filter(r=>!r.ok).length;
  cls('sh-deliver');render();
  setTimeout(()=>toast(bad>0?`⚠️ Delivered — ${bad} discrepancy/ies flagged`:'✅ Delivered & fully reconciled'),100);
}

// ── AMEND ORDER (full screen) ──
function openAmendOrder(oid){
  const o=S.orders.find(x=>x.id===oid);
  if(!o) return;
  S.selOrder=oid;
  S.amendOrderId=oid;
  // Pre-fill cart from order items, matching catalog IDs by name
  S.cart=o.items.map(item=>{
    const cat=catalog.find(c=>c.name===item.name);
    return{id:cat?cat.id:'x'+item.name,name:item.name,qty:item.qty,unit:item.unit,price:item.price};
  });
  S.catFilter='All';
  nav('amend-order');
}

function rAmendOrder(){
  const o=S.orders.find(x=>x.id===S.amendOrderId);
  const cf=S.catFilter||'All';
  const cats=['All','Meat','Bread','Sauce','Dips','Sides'];
  const items=cf==='All'?catalog:catalog.filter(c=>c.cat===cf);
  const newTotal=Math.round(S.cart.reduce((s,c)=>s+c.qty*c.price,0)*1.05);
  const origTotal=o?o.total:0;
  const diff=newTotal-origTotal;
  return`<div class="sec">
    <!-- diff banner -->
    <div style="background:var(--sf-dim);border:1px solid var(--sf);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;">
      <div><div style="font-size:11px;font-weight:700;color:#B45309;text-transform:uppercase;letter-spacing:.05em;">Original Total</div>
        <div style="font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;">₹${origTotal.toLocaleString()}</div></div>
      <div style="text-align:right;">
        <div style="font-size:11px;font-weight:700;color:#B45309;text-transform:uppercase;letter-spacing:.05em;">Revised Total</div>
        <div style="font-family:'Poppins',sans-serif;font-weight:700;font-size:16px;color:${diff>0?'var(--ember)':diff<0?'var(--sage)':'var(--coal)'};">
          ₹${newTotal.toLocaleString()}
          ${diff!==0?`<span style="font-size:12px;">(${diff>0?'+':''}₹${diff.toLocaleString()})</span>`:''}
        </div></div>
    </div>
    <!-- category filter -->
    <div class="cr">
      ${cats.map(c=>`<button class="chip ${cf===c?'on':''}" onclick="S.catFilter='${c}';render()">${c}</button>`).join('')}
    </div>
    <div class="card">
      ${items.map(it=>{
        const ci=S.cart.find(c=>c.id===it.id);
        const qty=ci?ci.qty:0;
        const inOriginal=o&&o.items.find(i=>i.name===it.name);
        return`<div class="ci" style="${inOriginal?'background:rgba(232,168,56,.05);':''}">
          <div class="cic">${it.em}</div>
          <div style="flex:1;">
            <div class="cn">${it.name} ${inOriginal?'<span style="font-size:10px;background:var(--sf-dim);color:#B45309;padding:1px 6px;border-radius:5px;font-weight:700;">in order</span>':''}</div>
            <div class="cp">₹${it.price} / ${it.unit}</div>
          </div>
          <div class="qc">
            <button class="qb minus" onclick="changeQty('${it.id}',-1)" style="${qty===0?'opacity:.25;pointer-events:none;':''}">−</button>
            <span class="qv" style="${qty>0?'color:var(--sf);':'color:var(--muted);'}">${qty}</span>
            <button class="qb plus" onclick="changeQty('${it.id}',1)">+</button>
          </div>
        </div>`;}).join('')}
    </div>
    <div style="height:80px;"></div>
    <div style="position:absolute;bottom:0;left:0;right:0;padding:12px 16px;background:var(--wh);border-top:1px solid var(--bdr);z-index:10;">
      <button class="btn btn-p btn-full" onclick="doAmend()">Submit Amendment Request</button>
    </div>
  </div>`;
}

function doAmend(){
  const o=S.orders.find(x=>x.id===S.amendOrderId);
  if(o){
    o.status='amended';
    o.amendedItems=S.cart.map(c=>({...c,total:c.qty*c.price}));
    const sub=S.cart.reduce((s,c)=>s+c.qty*c.price,0);
    o.amendedTotal=Math.round(sub*1.05);
  }
  S.cart=[];
  S.selOrder=S.amendOrderId;
  nav('order-detail');
  setTimeout(()=>toast('✏️ Amendment sent to admin for approval'),200);
}
function doWaste(){
  const item=document.getElementById('w-item')?.value||'Item';
  const qty=document.getElementById('w-qty')?.value||'1';
  const unit=document.getElementById('w-unit')?.value||'kg';
  const reason=document.getElementById('w-reason')?.value||'Other';
  const val=Math.round((pxMap[item]||200)*parseFloat(qty));
  S.waste.unshift({item,qty:`${qty} ${unit}`,val,reason,date:'26 Jul'});
  cls('sh-waste');render();
  setTimeout(()=>toast('🗑️ Wastage logged'),100);
}

// ── SHEET HELPERS ──
function ops(id){document.getElementById(id).classList.add('on');}
function cls(id){document.getElementById(id).classList.remove('on');}

// ── TOAST ──
let _tt;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('on'),3000);
}

// ── INIT ──
nav('home');
</script>
</body>
</html>
